<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/src/styles/styles.css">
    <script src="/src/core/utils.js" defer></script>
</head>
<body>

<div class="login-card">
    <h2>Iniciar Sesión</h2>
    <form action="/login" method="POST">

        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="nombre" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="contrasena" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">Aceptar</button>
    </form>

    <div class="login-card__message--error" id="error-message">
        Usuario o contraseña incorrectos
    </div>

</div>
</body>
</html>
